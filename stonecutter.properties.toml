# Mod metadata and dependency versions (Stonecutter structured properties).
# Top-level keys apply everywhere; ["<mc version>"] tables apply only to that version's projects.
# Branch names (common, fabric, neoforge, forge) are lookup tags, so never use one as a key segment (deps.neoforge breaks).

mod.id = "cartridge_mod"                 # D2
mod.name = "Cartridge"                   # D2
mod.group = "com.nanobuntv.cartridge"    # D2
mod.version = "1.0.0"
mod.authors = "NanoBunTV"
mod.license = "GPL-3.0-only"             # D219 (was All Rights Reserved, D4)
mod.slug = "cartridge-mod"               # Modrinth and CurseForge (D207)
mod.sources = "https://github.com/NanoBunTV/Minecraft-Cartridge"  # public; cartridge-host downloads from here (D218)
mod.description = "Real retro consoles: burn your own ROMs onto cartridges, play them on in-world TVs with friends over automatic netplay."

# D195: the Cartridge Arcade add-on, built in this repository as its own jars. It needs Cartridge of the same version.
arcade.mod.id = "cartridge_arcade"
arcade.mod.name = "Cartridge: Arcade"         # the mod list name, the user's pick
arcade.mod.group = "com.nanobuntv.cartridge.arcade"
arcade.mod.version = "1.0.0"
arcade.mod.authors = "NanoBunTV"
arcade.mod.license = "GPL-3.0-only"          # D219
arcade.mod.slug = "cartridge-arcade"          # its own project page (D208)
arcade.mod.sources = "https://github.com/NanoBunTV/Minecraft-Cartridge"
arcade.mod.description = "Arcade cabinets add-on for Cartridge mod: your own MAME romsets on Arcade Boards, played on upright cabinets with automatic netplay."

deps.mixin = "0.8.7"
deps.mixinextras = "0.5.5"
deps.fabric_loader = "0.19.5"

# Per version (D210): YetAnotherConfigLib (D122) is required on every loader; deps.yacl_* are full Maven coordinates
# because its artifacts were named differently before 1.20.1. yacl_common is the Mojang-named build common compiles
# against. Mod Menu is optional on Fabric. mixins.client lists the client mixins that exist on that version.

["1.21.1"]
java = 21
mc.pack_meta = '"pack_format": 34'      # pack.mcmeta's format field(s) for this MC version; "" ships no pack.mcmeta
mixins.client = "GuiMixin ItemInHandLayerMixin ItemRendererMixin KeyboardHandlerMixin LocalPlayerMixin MouseHandlerMixin PlayerRendererMixin"
mc.compat_fabric = ">=1.21.1 <1.21.2"
mc.compat_neoforge = "[1.21.1]"
deps.neoform = "1.21.1-20240808.144430"
deps.parchment_mc = "1.21.1"
deps.parchment = "2024.11.17"
deps.fabric_api = "0.116.17+1.21.1"
deps.neoforge_version = "21.1.255"
deps.neoforge_range = "[21.1.0,)"
deps.yacl_common = "dev.isxander:yet-another-config-lib:3.8.1+1.21.1-neoforge"
deps.yacl_fabric = "dev.isxander:yet-another-config-lib:3.8.1+1.21.1-fabric"
deps.yacl_neoforge = "dev.isxander:yet-another-config-lib:3.8.1+1.21.1-neoforge"
deps.yacl_id = "yet_another_config_lib_v3"
deps.yacl_range = "3.8.1"
deps.modmenu = "11.0.5"                  # optional on Fabric: the Config button (D122)

