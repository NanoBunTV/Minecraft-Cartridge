modLoader = "javafml"
loaderVersion = "${forge_loader_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "${mod_icon}"
displayURL = "https://modrinth.com/mod/${mod_slug}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_range}"
ordering = "NONE"
side = "BOTH"

# Cartridge's console kinds and controls come first, then the add-on's (D195).
[[dependencies.${mod_id}]]
modId = "cartridge_mod"
mandatory = true
versionRange = "[${cartridge_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${mc_compat_forge}"
ordering = "NONE"
side = "BOTH"
