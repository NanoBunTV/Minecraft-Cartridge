modLoader = "javafml"
loaderVersion = "${forge_loader_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "${mod_icon}"
displayURL = "https://modrinth.com/mod/${mod_slug}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# NeoForge 47.1 (1.20.1) still calls itself "forge", so this jar loads there too (D210).
[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "${yacl_id}"
mandatory = true
versionRange = "[${yacl_range},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${mc_compat_forge}"
ordering = "NONE"
side = "BOTH"
